# Copiar a /etc/nginx/sites-available/copsstec
# Luego: ln -s /etc/nginx/sites-available/copsstec /etc/nginx/sites-enabled/copsstec
# Reemplaza TU_DOMINIO.com por tu dominio real.

upstream copsstec_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream copsstec_backend {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://copsstec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Solo media del backend (uploads). Landing/brand/login/bulletin los sirve Next.js.
    location ~ ^/media/(notices|member-documents|members|membership|blogs|payments|votaciones|agreements|courses)(/|$) {
        proxy_pass http://copsstec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://copsstec_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
